<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chambord</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet" />
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --stone:   #0c0d10;
  --deep:    #10121a;
  --fog:     #1a1e2a;
  --amber:   #c97d2e;
  --flame:   #e8a048;
  --cold:    #4a6080;
  --mist:    #7a8fa8;
  --ash:     #b8c4d0;
  --white:   #eff2f6;
}

html, body {
  height: 100%;
  background: var(--stone);
  color: var(--white);
  font-family: 'Montserrat', sans-serif;
  overflow: hidden;
}

/* ── Background layers ── */
.bg {
  position: fixed;
  inset: 0;
  z-index: 0;
}

/* Deep fog gradient */
.bg-fog {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse 80% 60% at 50% 100%, rgba(74,96,128,0.18) 0%, transparent 70%),
    radial-gradient(ellipse 40% 30% at 50% 85%, rgba(201,125,46,0.08) 0%, transparent 60%),
    linear-gradient(to bottom, #060709 0%, #10121a 40%, #0c0e14 100%);
}

/* Animated mist */
.mist-layer {
  position: absolute;
  bottom: 0;
  left: -20%;
  width: 140%;
  height: 35%;
  background: linear-gradient(to top, rgba(74,96,128,0.12), transparent);
  animation: mistDrift 18s ease-in-out infinite alternate;
  filter: blur(20px);
}
.mist-layer-2 {
  position: absolute;
  bottom: 5%;
  left: -10%;
  width: 120%;
  height: 20%;
  background: linear-gradient(to top, rgba(74,96,128,0.07), transparent);
  animation: mistDrift 25s ease-in-out infinite alternate-reverse;
  filter: blur(30px);
}

@keyframes mistDrift {
  from { transform: translateX(0) scaleY(1); opacity: 0.6; }
  to   { transform: translateX(5%) scaleY(1.15); opacity: 1; }
}

/* Château silhouette */
.chateau {
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 900px;
  opacity: 0.22;
}

/* Particle canvas */
#particles { position: absolute; inset: 0; }

/* ── Scene layout ── */
.scene {
  position: relative;
  z-index: 1;
  height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 2rem;
  gap: 0;
}

/* ── Eyebrow ── */
.eyebrow {
  font-family: 'Montserrat', sans-serif;
  font-size: 0.62rem;
  font-weight: 600;
  letter-spacing: 0.38em;
  text-transform: uppercase;
  color: var(--amber);
  margin-bottom: 2.2rem;
  opacity: 0;
  animation: fadeDown 1s ease 0.6s forwards;
}

/* ── Main title ── */
h1 {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 300;
  font-size: clamp(3.8rem, 12vw, 7.5rem);
  line-height: 0.92;
  letter-spacing: -0.01em;
  color: var(--white);
  opacity: 0;
  animation: fadeUp 1.2s ease 0.9s forwards;
}

h1 em {
  font-style: italic;
  color: var(--flame);
  display: block;
}

/* ── Thin rule ── */
.rule {
  width: 1px;
  height: 60px;
  background: linear-gradient(to bottom, transparent, var(--amber), transparent);
  margin: 2.4rem auto;
  opacity: 0;
  animation: fadeUp 1s ease 1.4s forwards;
}

/* ── Sub ── */
.sub {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-weight: 300;
  font-size: 1.15rem;
  color: var(--mist);
  letter-spacing: 0.04em;
  max-width: 420px;
  line-height: 1.65;
  opacity: 0;
  animation: fadeUp 1s ease 1.6s forwards;
}

/* ── CTA ── */
.cta-wrap {
  margin-top: 3rem;
  opacity: 0;
  animation: fadeUp 1s ease 2s forwards;
}

.cta {
  display: inline-flex;
  align-items: center;
  gap: 1rem;
  font-family: 'Montserrat', sans-serif;
  font-size: 0.65rem;
  font-weight: 600;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  color: var(--ash);
  text-decoration: none;
  border-bottom: 1px solid rgba(184,196,208,0.3);
  padding-bottom: 0.4rem;
  transition: color 0.3s, border-color 0.3s;
}
.cta:hover { color: var(--flame); border-color: var(--flame); }
.cta:hover .arrow { transform: translateX(6px); }
.cta .arrow { transition: transform 0.3s; }

/* ── Hint ── */
.hint {
  position: fixed;
  bottom: 2.5rem;
  left: 50%;
  transform: translateX(-50%);
  font-size: 0.58rem;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--cold);
  opacity: 0;
  animation: breathe 3s ease 3.5s infinite;
}

/* ── Keyframes ── */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(18px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes fadeDown {
  from { opacity: 0; transform: translateY(-10px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes breathe {
  0%, 100% { opacity: 0.25; }
  50%       { opacity: 0.6;  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::after { animation: none !important; transition: none !important; opacity: 1 !important; }
}
</style>
</head>
<body>

<div class="bg">
  <div class="bg-fog"></div>

  <!-- Chambord silhouette SVG -->
  <svg class="chateau" viewBox="0 0 900 340" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMax meet">
    <!-- Main body -->
    <rect x="80" y="180" width="740" height="160" fill="#b8c4d0"/>
    <!-- Central donjon -->
    <rect x="340" y="80" width="220" height="260" fill="#c8d4e0"/>
    <!-- Donjon towers -->
    <rect x="300" y="100" width="60" height="240" fill="#b0bcc8"/>
    <rect x="540" y="100" width="60" height="240" fill="#b0bcc8"/>
    <!-- Lantern tower -->
    <rect x="390" y="20" width="120" height="80" fill="#c8d4e0"/>
    <polygon points="450,0 390,20 510,20" fill="#c8d4e0"/>
    <!-- Lantern finial -->
    <line x1="450" y1="0" x2="450" y2="-15" stroke="#b8c4d0" stroke-width="2"/>
    <!-- Corner towers main -->
    <rect x="80" y="140" width="80" height="200" fill="#a8b4c0"/>
    <rect x="740" y="140" width="80" height="200" fill="#a8b4c0"/>
    <!-- Corner tower caps -->
    <polygon points="120,120 80,140 160,140" fill="#a8b4c0"/>
    <polygon points="780,120 740,140 820,140" fill="#a8b4c0"/>
    <!-- Flanking towers -->
    <rect x="200" y="155" width="55" height="185" fill="#b0bcc8"/>
    <rect x="645" y="155" width="55" height="185" fill="#b0bcc8"/>
    <polygon points="227,138 200,155 255,155" fill="#b0bcc8"/>
    <polygon points="672,138 645,155 700,155" fill="#b0bcc8"/>
    <!-- Windows - central donjon -->
    <rect x="360" y="110" width="18" height="28" rx="9" fill="#0c0d10" opacity="0.7"/>
    <rect x="420" y="110" width="18" height="28" rx="9" fill="#0c0d10" opacity="0.7"/>
    <rect x="480" y="110" width="18" height="28" rx="9" fill="#0c0d10" opacity="0.7"/>
    <!-- Amber lit windows -->
    <rect x="360" y="155" width="18" height="28" rx="9" fill="#c97d2e" opacity="0.6"/>
    <rect x="480" y="155" width="18" height="28" rx="9" fill="#c97d2e" opacity="0.5"/>
    <rect x="420" y="200" width="18" height="28" rx="9" fill="#c97d2e" opacity="0.7"/>
    <!-- Main body windows -->
    <rect x="150" y="200" width="14" height="22" rx="7" fill="#0c0d10" opacity="0.6"/>
    <rect x="220" y="200" width="14" height="22" rx="7" fill="#c97d2e" opacity="0.5"/>
    <rect x="620" y="200" width="14" height="22" rx="7" fill="#c97d2e" opacity="0.5"/>
    <rect x="690" y="200" width="14" height="22" rx="7" fill="#0c0d10" opacity="0.6"/>
    <!-- Grand entrance -->
    <rect x="415" y="280" width="70" height="60" rx="2" fill="#0c0d10" opacity="0.8"/>
    <!-- Ground reflection -->
    <ellipse cx="450" cy="340" rx="380" ry="18" fill="#b8c4d0" opacity="0.06"/>
  </svg>

  <div class="mist-layer"></div>
  <div class="mist-layer-2"></div>
  <canvas id="particles"></canvas>
</div>

<div class="scene">
  <p class="eyebrow">Château de Chambord &nbsp;·&nbsp; pour toi</p>

  <h1>
    Quelque<br/>
    <em>chose attend.</em>
  </h1>

  <div class="rule"></div>

  <p class="sub">
    Dans les couloirs de pierre et de brume,<br/>
    quelqu'un a laissé un message pour toi.
  </p>

  <div class="cta-wrap">
    <a class="cta" href="page2.html">
      Entrer <span class="arrow">→</span>
    </a>
  </div>
</div>

<p class="hint">I · III</p>

<script>
// Floating ember particles
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}

const TYPES = ['ember', 'dust'];
const particles = [];

function createParticle() {
  const type = TYPES[Math.floor(Math.random() * 2)];
  return {
    type,
    x: Math.random() * W,
    y: H + 10,
    r: type === 'ember' ? Math.random() * 1.5 + 0.5 : Math.random() * 1 + 0.3,
    vy: -(Math.random() * 0.6 + 0.2),
    vx: (Math.random() - 0.5) * 0.3,
    a: Math.random() * 0.6 + 0.2,
    life: 0,
    maxLife: Math.random() * 300 + 200,
    hue: type === 'ember' ? Math.random() * 30 + 20 : 210,
  };
}

// Seed initial particles
for (let i = 0; i < 60; i++) {
  const p = createParticle();
  p.y = Math.random() * H;
  p.life = Math.random() * p.maxLife;
  particles.push(p);
}

function drawParticles() {
  ctx.clearRect(0, 0, W, H);

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx + Math.sin(p.life * 0.02) * 0.15;
    p.y += p.vy;
    p.life++;

    const prog = p.life / p.maxLife;
    const alpha = p.a * Math.sin(prog * Math.PI);

    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);

    if (p.type === 'ember') {
      ctx.fillStyle = `hsla(${p.hue}, 80%, 65%, ${alpha})`;
      if (p.r > 1) {
        ctx.shadowBlur = 6;
        ctx.shadowColor = `hsla(${p.hue}, 80%, 65%, ${alpha * 0.5})`;
      }
    } else {
      ctx.fillStyle = `hsla(210, 30%, 70%, ${alpha * 0.4})`;
      ctx.shadowBlur = 0;
    }
    ctx.fill();
    ctx.shadowBlur = 0;

    if (p.life >= p.maxLife || p.y < -10) {
      particles[i] = createParticle();
    }
  }
  requestAnimationFrame(drawParticles);
}

resize();
drawParticles();
window.addEventListener('resize', resize);
</script>
</body>
</html>
