<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Le Château de Tony</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet" />
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --stone:  #0c0d10;
  --panel:  #13161f;
  --amber:  #c97d2e;
  --flame:  #e8a048;
  --cold:   #4a6080;
  --mist:   #7a8fa8;
  --ash:    #b8c4d0;
  --white:  #eff2f6;
  --rose:   #c45c7a;
}

html, body {
  height: 100%;
  background: var(--stone);
  color: var(--white);
  font-family: 'Montserrat', sans-serif;
  overflow: hidden;
}

/* Sky */
.sky {
  position: fixed; inset: 0; z-index: 0;
  background: linear-gradient(180deg, #06080f 0%, #0d1220 35%, #161a28 60%, #0c0d10 100%);
}

/* Moon */
.moon {
  position: fixed; top: 7vh; right: 16vw;
  width: 64px; height: 64px; border-radius: 50%;
  background: radial-gradient(circle at 38% 38%, #f8f0d8, #cfc090);
  box-shadow: 0 0 40px rgba(248,240,216,0.15), 0 0 80px rgba(248,240,216,0.05);
  z-index: 1;
}

/* Mist */
.mist {
  position: fixed; bottom: 0; left: -10%; width: 120%; height: 28%;
  background: linear-gradient(to top, rgba(74,96,128,0.12), transparent);
  filter: blur(20px); z-index: 2; pointer-events: none;
  animation: mistDrift 22s ease-in-out infinite alternate;
}
.mist2 {
  position: fixed; bottom: 4%; left: -5%; width: 110%; height: 16%;
  background: linear-gradient(to top, rgba(74,96,128,0.06), transparent);
  filter: blur(30px); z-index: 2; pointer-events: none;
  animation: mistDrift 30s ease-in-out infinite alternate-reverse;
}
@keyframes mistDrift {
  from { transform: translateX(0); opacity: 0.7; }
  to   { transform: translateX(4%); opacity: 1; }
}

/* Particles */
#particles { position: fixed; inset: 0; z-index: 3; pointer-events: none; }

/* Castle — bottom of screen, purely decorative */
.castle-wrap {
  position: fixed; bottom: 0; left: 50%;
  transform: translateX(-50%);
  width: min(860px, 100vw);
  z-index: 4; pointer-events: none;
}

/* All content sits above everything */
.scene {
  position: relative; z-index: 10;
  height: 100vh;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 2rem; text-align: center;
}

.eyebrow {
  font-size: 0.58rem; font-weight: 600;
  letter-spacing: 0.42em; text-transform: uppercase;
  color: var(--amber); margin-bottom: 1.8rem;
  opacity: 0; animation: fadeDown 1s ease 0.5s forwards;
}

h1 {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 300;
  font-size: clamp(3.2rem, 10vw, 6.5rem);
  line-height: 0.92;
  opacity: 0; animation: fadeUp 1.1s ease 0.8s forwards;
}
h1 em { font-style: italic; color: var(--flame); display: block; }

.rule {
  width: 1px; height: 44px;
  background: linear-gradient(to bottom, transparent, rgba(201,125,46,0.45), transparent);
  margin: 1.8rem auto;
  opacity: 0; animation: fadeUp 1s ease 1.2s forwards;
}

/* Code panel */
.door-panel {
  background: rgba(13,16,25,0.85);
  border: 1px solid rgba(201,125,46,0.2);
  padding: 1.8rem 2.2rem 1.6rem;
  max-width: 340px; width: 100%;
  backdrop-filter: blur(12px);
  position: relative;
  opacity: 0; animation: fadeUp 1s ease 1.5s forwards;
}
.door-panel::before, .door-panel::after {
  content: ''; position: absolute;
  width: 12px; height: 12px;
  border-color: rgba(201,125,46,0.38); border-style: solid;
}
.door-panel::before { top: 6px; left: 6px; border-width: 1px 0 0 1px; }
.door-panel::after  { bottom: 6px; right: 6px; border-width: 0 1px 1px 0; }

.door-label {
  font-size: 0.56rem; font-weight: 600;
  letter-spacing: 0.32em; text-transform: uppercase;
  color: var(--mist); margin-bottom: 0.5rem;
}
.door-hint {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic; font-size: 0.95rem;
  color: rgba(184,196,208,0.6); line-height: 1.6;
  margin-bottom: 1.5rem;
}
.door-hint span { color: var(--amber); font-style: normal; }

.input-row { display: flex; gap: 0.6rem; }

.code-input {
  flex: 1;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(201,125,46,0.25);
  color: var(--white);
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.25rem; font-weight: 300;
  letter-spacing: 0.15em;
  padding: 0.75rem 1rem;
  outline: none; text-align: center;
  transition: border-color 0.3s;
}
.code-input::placeholder { color: rgba(184,196,208,0.2); font-size: 0.95rem; }
.code-input:focus { border-color: rgba(201,125,46,0.55); }

.enter-btn {
  background: transparent;
  border: 1px solid rgba(201,125,46,0.38);
  color: var(--amber);
  font-family: 'Montserrat', sans-serif;
  font-size: 0.62rem; font-weight: 600;
  letter-spacing: 0.2em; text-transform: uppercase;
  padding: 0 1.1rem; cursor: pointer;
  transition: background 0.25s, color 0.25s;
  white-space: nowrap;
}
.enter-btn:hover { background: var(--amber); color: var(--stone); }

.error-msg {
  margin-top: 0.85rem; font-size: 0.7rem;
  letter-spacing: 0.06em; color: var(--rose);
  opacity: 0; transition: opacity 0.35s; min-height: 1em;
}
.error-msg.show { opacity: 1; }

/* Door open — two panels slide apart */
.door-half {
  position: fixed; top: 0; bottom: 0; width: 50%;
  background: var(--stone); z-index: 20;
  transition: transform 1.5s cubic-bezier(0.76, 0, 0.24, 1);
  pointer-events: none;
  /* Hidden by default — only appear when opening */
  transform: translateX(-100%);
}
.door-right {
  left: auto; right: 0;
  transform: translateX(100%);
}
/* When triggered: left slides further left, right further right */
.door-half.closing   { transform: translateX(0); }
.door-half.open      { transform: translateX(-100%); }
.door-right.closing  { transform: translateX(0); }
.door-right.open     { transform: translateX(100%); }

.hint-foot {
  position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%);
  font-size: 0.55rem; letter-spacing: 0.28em; text-transform: uppercase;
  color: var(--cold); z-index: 10; white-space: nowrap;
  opacity: 0; animation: breathe 3s ease 3.5s infinite;
}

@keyframes fadeUp   { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
@keyframes fadeDown { from { opacity:0; transform:translateY(-10px); } to { opacity:1; transform:translateY(0); } }
@keyframes breathe  { 0%,100% { opacity:.2; } 50% { opacity:.55; } }
@keyframes shake    { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
.shake { animation: shake 0.38s ease; }

@media (prefers-reduced-motion: reduce) {
  *, *::after { animation: none !important; transition: none !important; opacity: 1 !important; }
}
</style>

<!-- ── MAIN CONTENT ── -->
<div class="scene">

  <p class="eyebrow">Pour toi &nbsp;·&nbsp; une surprise t'attend</p>

  <h1>Le Château<br/><em>de Tony</em></h1>

  <div class="rule"></div>

  <div class="door-panel">
    <p class="door-label">Le portail est verrouillé</p>
    <p class="door-hint">
      Indice — <span>la marque de ta voiture,<br/>celle que tu vois partout.</span>
    </p>
    <div class="input-row">
      <input
        class="code-input"
        id="codeInput"
        type="text"
        placeholder="mot secret..."
        autocomplete="off" autocorrect="off"
        autocapitalize="off" spellcheck="false"
        maxlength="14"
      />
      <button class="enter-btn" id="enterBtn">Entrer</button>
    </div>
    <p class="error-msg" id="errorMsg">Ce n'est pas le bon mot… réessaie.</p>
  </div>

</div>

<p class="hint-foot">Entre le mot secret pour ouvrir les portes</p>

<script>
/* Particles */
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');
let W, H;
function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
const pts = [];
function mkP(startY) {
  const ember = Math.random() > 0.52;
  return {
    x: Math.random() * (W || innerWidth),
    y: startY !== undefined ? startY : (H || innerHeight) + 10,
    r: Math.random() * (ember ? 1.3 : 0.8) + 0.25,
    vy: -(Math.random() * 0.52 + 0.14),
    vx: (Math.random() - 0.5) * 0.25,
    a: Math.random() * 0.5 + 0.15,
    life: 0, maxLife: Math.random() * 320 + 200, ember,
  };
}
for (let i = 0; i < 65; i++) { const p = mkP(Math.random() * innerHeight); p.life = Math.random() * p.maxLife; pts.push(p); }
function drawP() {
  ctx.clearRect(0, 0, W, H);
  for (let i = 0; i < pts.length; i++) {
    const p = pts[i];
    p.x += p.vx + Math.sin(p.life * 0.019) * 0.12;
    p.y += p.vy; p.life++;
    const alpha = p.a * Math.sin((p.life / p.maxLife) * Math.PI);
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    if (p.ember) { ctx.fillStyle = `hsla(28,78%,64%,${alpha})`; ctx.shadowBlur = 5; ctx.shadowColor = `hsla(28,78%,64%,${alpha*0.4})`; }
    else { ctx.fillStyle = `hsla(210,26%,66%,${alpha*0.35})`; ctx.shadowBlur = 0; }
    ctx.fill(); ctx.shadowBlur = 0;
    if (p.life >= p.maxLife || p.y < -10) pts[i] = mkP();
  }
  requestAnimationFrame(drawP);
}
resize(); drawP();
window.addEventListener('resize', resize);

/* Secret door logic */
const inp   = document.getElementById('codeInput');
const btn   = document.getElementById('enterBtn');
const err   = document.getElementById('errorMsg');
const dL    = document.getElementById('doorLeft');
const dR    = document.getElementById('doorRight');

function attempt() {
  const val = inp.value.trim().toLowerCase();
  if (val === 'clio') {
    err.classList.remove('show');
    inp.disabled = true; btn.disabled = true;
    // Slam doors closed first, then swing open
    dL.classList.add('closing');
    dR.classList.add('closing');
    setTimeout(() => {
      dL.classList.remove('closing'); dL.classList.add('open');
      dR.classList.remove('closing'); dR.classList.add('open');
    }, 400);
    setTimeout(() => { window.location.href = 'page2.html'; }, 2100);
  } else {
    err.classList.add('show');
    inp.classList.add('shake');
    inp.addEventListener('animationend', () => inp.classList.remove('shake'), { once: true });
    setTimeout(() => err.classList.remove('show'), 2600);
    inp.value = ''; inp.focus();
  }
}

btn.addEventListener('click', attempt);
inp.addEventListener('keydown', e => { if (e.key === 'Enter') attempt(); });
inp.focus();
</script>
